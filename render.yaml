services:
  - type: web
    name: vault-bank
    env: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production

      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false

      - key: SESSION_SECRET
        sync: false

      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        value: Vault Bank <onboarding@resend.dev>

      - key: APP_URL
        sync: false
